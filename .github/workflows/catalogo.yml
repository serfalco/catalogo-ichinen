name: Actualizar catálogo

# Cuándo corre:
#  - Una vez por semana (lunes 09:00 UTC = 06:00 Argentina aprox.)
#  - Cuando se aprieta el botón "Run workflow" en la pestaña Actions
#  - Cuando se modifica el motor o el propio workflow
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "motor/**"
      - ".github/workflows/catalogo.yml"

# Permite que el workflow escriba en el repo (commitear el sitio generado)
permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas openpyxl unidecode

      - name: Ver si el Excel cambió desde la última vez
        id: huella
        run: |
          URL="${{ vars.EXCEL_URL }}"
          if [ -z "$URL" ]; then echo "Falta la variable EXCEL_URL"; exit 1; fi
          # Hostinger (LiteSpeed) puede colgar el HEAD por negociación HTTP/2-3.
          # Forzamos HTTP/1.1, mandamos User-Agent de navegador y reintentamos.
          HEADERS=$(curl -sIL --http1.1 \
            -A "Mozilla/5.0 (compatible; IchinenBuild/1.0)" \
            --connect-timeout 20 --max-time 45 --retry 3 --retry-delay 5 \
            "$URL" || true)
          HUELLA=$(echo "$HEADERS" | grep -iE "last-modified:|content-length:" | tr -d '\r' | sort | md5sum | cut -d' ' -f1)
          # Si el HEAD no devolvió nada útil, no abortamos: reconstruimos igual.
          if [ -z "$HEADERS" ] || [ -z "$(echo "$HEADERS" | grep -iE "last-modified:|content-length:")" ]; then
            echo "No se pudo leer la huella; se reconstruye por las dudas."
            echo "actual=forzar-$(date +%s)" >> "$GITHUB_OUTPUT"
            echo "cambio=si" >> "$GITHUB_OUTPUT"
          else
            echo "actual=$HUELLA" >> "$GITHUB_OUTPUT"
            ANTERIOR=""
            if [ -f .huella_excel ]; then ANTERIOR=$(cat .huella_excel); fi
            if [ "$HUELLA" = "$ANTERIOR" ] && [ "${{ github.event_name }}" = "schedule" ]; then
              echo "cambio=no" >> "$GITHUB_OUTPUT"
              echo "El Excel no cambió. No hace falta reconstruir."
            else
              echo "cambio=si" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Construir el catálogo
        if: steps.huella.outputs.cambio == 'si'
        env:
          EXCEL_URL: ${{ vars.EXCEL_URL }}
          BUSCAR_TAPAS: "1"
          LIMITE_TAPAS: "800"
          # Completa autor, editorial, año, páginas y temas por ISBN.
          # Solo rellena huecos; nunca pisa un dato que el Excel traía bien.
          ENRIQUECER: "1"
          LIMITE_ENRIQUECER: "3000"
        run: |
          python motor/build.py
          echo "${{ steps.huella.outputs.actual }}" > .huella_excel

      - name: Publicar cambios
        if: steps.huella.outputs.cambio == 'si'
        run: |
          git config user.name "Catálogo Ichinén (bot)"
          git config user.email "actions@github.com"
          # Todo lo que publicamos es SALIDA GENERADA: docs/, las cachés y el
          # respaldo del Excel. Si mientras corríamos otra corrida publicó, no
          # hay nada que fusionar — nuestra salida es más nueva y manda. Por eso
          # se rebasea sobre origin/main en vez de hacer pull --rebase, que
          # entra en conflicto con archivos generados (pasó con .huella_excel:
          # dejó el repo en estado inconsistente y se perdieron 18 minutos de
          # consultas a las APIs).
          for intento in 1 2 3; do
            git fetch origin main
            git reset --soft origin/main
            git add -A docs .huella_excel .tapas_fallidas.json .enriquecido.json listado_ultimo_ok.xlsx 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "Sin cambios para publicar."
              exit 0
            fi
            git commit -q -m "Actualizar catálogo $(date +%Y-%m-%d)"
            if git push origin HEAD:main; then
              echo "Publicado."
              exit 0
            fi
            echo "Push rechazado, reintento $intento …"
            sleep 5
          done
          # Sin esto el job termina en verde aunque no haya publicado nada,
          # que es exactamente lo que pasó y por qué no nos enteramos.
          echo "::error::No se pudo publicar después de 3 intentos."
          exit 1
